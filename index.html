<!-- TOP APP BAR -->
  <header class="top-bar no-print">
    <div class="title-group">
      <span class="app-brand">CALL SHEET LAB</span>
      <input 
        type="text" 
        id="sheetTitleInput" 
        class="editable-sheet-title" 
        placeholder="Enter Sheet Name..." 
        aria-label="Call sheet name"
      />
      <span class="divider">·</span>
      <input 
        type="text" 
        id="opponentInput" 
        class="editable-opponent-info" 
        placeholder="Opponent Front & Coverage (e.g. 3-3-5 · COVER 3)" 
        aria-label="Opponent defense notes"
      />
    </div>
    <div class="header-actions">
      <button class="btn-yellow" id="saveSheetBtn">Save Week</button>
      <button class="btn-yellow" id="adjustDefenseBtn">Adjust defense</button>
    </div>
  </header>
